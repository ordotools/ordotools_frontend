<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordo Calendar</title>

    <link rel="preconnect" href="https://api.ordotools.org" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <button class="title" id="title" aria-label="Choose month">
            <span id="monthName">&nbsp;</span> <span class="year" id="yearName"></span>
        </button>
        <input type="month" id="picker" tabindex="-1" aria-hidden="true">
        <div class="options">
            <select aria-label="Diocese"><option>Diocese ▾</option><option disabled>Coming soon</option></select>
            <select aria-label="Language"><option>Language ▾</option><option disabled>Coming soon</option></select>
        </div>
        <nav class="nav" aria-label="Month navigation">
            <button id="prevBtn" aria-label="Previous month">‹</button>
            <button id="todayBtn">Today</button>
            <button id="nextBtn" aria-label="Next month">›</button>
        </nav>
    </header>

    <main>
        <div class="weekdays" aria-hidden="true">
            <span>Sunday</span><span>Monday</span><span>Tuesday</span><span>Wednesday</span><span>Thursday</span><span>Friday</span><span>Saturday</span>
        </div>
        <ol class="month" id="month" aria-label="Calendar"></ol>
        <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <dialog id="dayDialog" aria-labelledby="dayTitle">
        <div class="sheet">
            <form method="dialog"><button class="close" aria-label="Close">×</button></form>
            <p class="dialog-date" id="dayDate"></p>
            <h2 id="dayTitle"></h2>
            <dl id="dayBody"></dl>
        </div>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
